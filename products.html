<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKR Exclusive Collection - Products</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#111827;
color:white;
padding:15px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
}

button{
margin-top:10px;
padding:10px 20px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}
</style>
</head>

<body>

<header>
SKR Exclusive Collection
</header>

<div class="products">

<div class="card">
<img src="https://via.placeholder.com/250x200?text=Shoes">
<h3>Premium Shoes</h3>
<p>₹1999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x200?text=Watch">
<h3>Luxury Watch</h3>
<p>₹2999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x200?text=T-Shirt">
<h3>Premium T-Shirt</h3>
<p>₹999</p>
<button>Add to Cart</button>
</div>

<div class="card">
<img src="https://via.placeholder.com/250x200?text=Perfume">
<h3>Perfume</h3>
<p>₹1499</p>
<button>Add to Cart</button>
</div>

</div>

</body>
</html>
