<!DOCTYPE html>
<html>
<head>
  <title>SKR Tracking</title>
</head>
<body>

<h1>Track Your Parcel</h1>

<input type="text" id="trackingId" placeholder="Enter Tracking ID">
<button onclick="trackParcel()">Track</button>

<p id="result"></p>

<script>
function trackParcel() {
  var id = document.getElementById("trackingId").value;
  var result = document.getElementById("result");

  if (id === "SKR123") {
    result.innerHTML = "📦 Status: Shipped";
  } 
  else if (id === "SKR456") {
    result.innerHTML = "🚚 Status: Out for Delivery";
  } 
  else if (id === "SKR789") {
    result.innerHTML = "✅ Status: Delivered";
  } 
  else {
    result.innerHTML = "❌ Invalid Tracking ID";
  }
}
</script>

</body>
</html>
