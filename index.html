<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKR Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">SKR</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Track</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to SKR Services</h1>
        <p>Fast & Reliable Parcel Tracking System</p>
        <button onclick="scrollToTrack()">Track Parcel</button>
    </section>

    <!-- Tracking Section -->
    <section id="track">
        <h2>Track Your Parcel</h2>
        <input type="text" id="trackingId" placeholder="Enter Tracking ID">
        <button onclick="trackParcel()">Track</button>
        <p id="result"></p>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 SKR Website. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
