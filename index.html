<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKR Collection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }header {
  text-align: center;
  padding: 20px;
  background: white;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

header h1 {
  margin: 0;
}

header p {
  color: gray;
  font-size: 14px;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 10px;
}

.price {
  font-size: 18px;
  font-weight: bold;
  margin: 10px 0;
  color: #000;
}

.btn {
  display: inline-block;
  padding: 10px 15px;
  background: black;
  color: white;
  border-radius: 8px;
  text-decoration: none;
  margin-top: 10px;
}

.btn:hover {
  background: #333;
}

footer {
  text-align: center;
  padding: 15px;
  background: white;
  margin-top: 20px;
  font-size: 14px;
}

  </style>
</head>
<body><header>
  <h1>SKR Collection</h1>
  <p>Best Watches & Accessories in Vadodara</p>
</header><div class="container">  <!-- Product 1 -->  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Watch">
    <h3>Premium Watch</h3>
    <div class="price">₹999</div>
    <a class="btn" href="https://wa.me/918980764782?text=I%20want%20to%20buy%20Premium%20Watch">Order on WhatsApp</a>
  </div>  <!-- Product 2 -->  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Watch">
    <h3>Luxury Watch</h3>
    <div class="price">₹1499</div>
    <a class="btn" href="https://wa.me/918980764782?text=I%20want%20to%20buy%20Luxury%20Watch">Order on WhatsApp</a>
  </div>  <!-- Product 3 -->  <div class="card">
    <img src="https://via.placeholder.com/300" alt="Watch">
    <h3>Smart Watch</h3>
    <div class="price">₹1999</div>
    <a class="btn" href="https://wa.me/918980764782?text=I%20want%20to%20buy%20Smart%20Watch">Order on WhatsApp</a>
  </div></div><footer>
  <p>📞 8980764782</p>
  <p>Vadodara, Gujarat</p>
</footer></body>
</html>
