<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKR Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">SKR</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">Track</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to SKR Services</h1>
        <p>Fast & Reliable Parcel Tracking System</p>
        <button onclick="trackParcel()">Track</button>
    </section>

    <!-- Tracking Section -->
    <section id="track">
        <h2>Track Your Parcel</h2>
        <input type="text" id="trackId" placeholder="Enter Tracking ID">
        <button onclick="trackParcel()">Track</button>
        <p id="result"></p>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 SKR Website. All Rights Reserved.</p>
    </footer>
    
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy....",
  authDomain: "skr-website-8f01d.firebaseapp.com",
  projectId: "skr-website-8f01d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.trackParcel = async function () {
  const id = document.getElementById("trackId").value;

  const q = query(
    collection(db, "parcels"),
    where("trackingId", "==", id)
  );

  const snap = await getDocs(q);

  if (snap.empty) {
    document.getElementById("result").innerText = "Not Found ❌";
  } else {
    let output = "";
    snap.forEach(doc => {
      const x = doc.data();
      output += `Status: ${x.status}, Location: ${x.location}\n`;
    });
    document.getElementById("result").innerText = output;
  }
};
    </script>
    
    
</body>
</html>
